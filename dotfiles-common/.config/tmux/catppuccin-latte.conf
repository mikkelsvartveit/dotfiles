set -g @catppuccin_flavor "latte"
set -g @catppuccin_reset "true"
run ~/.tmux/plugins/tmux/catppuccin.tmux

# The reset leaves the current-window separators set from the default (basic)
# style, and the plugin only sets them when unset (-o), so clear them before
# applying the rounded style. Otherwise the active window keeps square edges.
set -g @catppuccin_window_status_style "rounded"
set -Ug @catppuccin_window_current_left_separator
set -Ug @catppuccin_window_current_middle_separator
set -Ug @catppuccin_window_current_right_separator
run ~/.tmux/plugins/tmux/catppuccin.tmux
