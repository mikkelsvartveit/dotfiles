set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'erikw/tmux-dark-notify'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Follow the macOS light/dark appearance
set -g @dark-notify-theme-path-light '$HOME/.config/tmux/catppuccin-latte.conf'
set -g @dark-notify-theme-path-dark '$HOME/.config/tmux/catppuccin-mocha.conf'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g default-terminal "tmux-256color"
set -s set-clipboard on
set -g status-left-length 40
bind C-b last-window
bind C-l switch-client -l

# Forward keys to terminal, used for some bindings in Neovim
set -g extended-keys always

run '~/.tmux/plugins/tpm/tpm'

# Re-apply the theme chosen by tmux-dark-notify on every config reload.
if-shell "test -e ~/.local/state/tmux/tmux-dark-notify-theme.conf" \
	"source-file ~/.local/state/tmux/tmux-dark-notify-theme.conf"
