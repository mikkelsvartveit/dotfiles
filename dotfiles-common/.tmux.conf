set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g default-terminal "tmux-256color"
set -s set-clipboard on
set -g status-left-length 40

bind C-b last-window
bind C-l switch-client -l
bind x kill-pane # Close pane without confirmation
bind S command-prompt -p "send pane to:" "join-pane -h -t ':%%'" # Move pane to window
bind -r Left swap-window -t -1\; select-window -t -1 # Move window left
bind -r Right swap-window -t +1\; select-window -t +1 # Move window right

# Forward keys to terminal, used for some bindings in Neovim
set -g extended-keys always

run '~/.tmux/plugins/tpm/tpm'
